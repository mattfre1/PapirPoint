<body data-page="sponsors">

      <p class="section__intro">Děkujeme všem, kteří PapírPOINT podporují. Bez nich by festival nebyl.</p>

      <!-- Partneři jsou seřazení podle abecedy, aby z pořadí nešlo číst důležitost.

           Přidání dalšího partnera:
           1. logo ořízni od prázdných okrajů, zmenši na max 800 px a ulož jako
              .webp do /obrazky/sponsors/ (originál patří do podklady/partneri/),
           2. zkopíruj jeden blok níž a doplň název, soubor a jeho rozměry,
           3. má-li partner bílé logo, přidej dlaždici třídu partner__tile--dark.

           Obrázky mají schválně alt="" – název partnera je hned pod dlaždicí
           jako text, jinak by ho čtečka přečetla dvakrát.

           Dlaždice schválně nikam neodkazují – je to poděkování, ne rozcestník. -->

      <div class="partner-grid">

        <div class="partner">
          <span class="partner__tile">
            <img src="/obrazky/sponsors/angry-albatros.png" alt="" width="222" height="205" loading="lazy" decoding="async">
          </span>
          <p class="partner__name">Angry Albatros</p>
        </div>

        <div class="partner">

        </div>
